<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Treino de Lógica</title>
<style>
:root {
  --bg: #f6f5f1; --surface: #ffffff; --ink: #1d1d1f; --muted: #6b6b70; --line: #e2e0d8;
  --accent: #ea1d2c; --accent-ink: #ffffff; --ok: #1f8a4c; --bad: #c62828; --warn: #b26a00;
  --soft: #f0eee7; --focus: #2563eb;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141416; --surface: #1d1d20; --ink: #ececee; --muted: #9a9aa2; --line: #2e2e33;
    --accent: #ff4b57; --accent-ink: #ffffff; --ok: #4cc27f; --bad: #ff6b6b; --warn: #f0a640;
    --soft: #26262a; --focus: #7aa7ff;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
#app { max-width: 760px; margin: 0 auto; padding: 24px 16px 64px; }
h1 { font-size: 1.7rem; margin: 0 0 4px; letter-spacing: -0.01em; }
h2 { font-size: 1.15rem; margin: 28px 0 10px; }
p { margin: 0 0 12px; }
.muted { color: var(--muted); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px; margin-bottom: 14px; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.btn { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 16px; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
.btn.big { width: 100%; padding: 16px; font-size: 1.1rem; }
.btn.link { background: none; border: none; color: var(--muted); padding: 6px 0; text-decoration: underline; }
.row { display: flex; gap: 10px; flex-wrap: wrap; }
.drills { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
details { border-top: 1px solid var(--line); padding: 10px 0; }
details summary { cursor: pointer; font-weight: 600; }
details p { margin-top: 8px; color: var(--muted); }

/* questão */
.qhead { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 8px; }
.qmeta { font-size: .95rem; color: var(--muted); }
.qmeta b { color: var(--ink); }
.timer { font-variant-numeric: tabular-nums; font-weight: 700; font-size: 1.3rem; padding: 4px 12px; border-radius: 999px; background: var(--soft); min-width: 74px; text-align: center; }
.timer.low { background: var(--bad); color: #fff; }
.progress { height: 6px; background: var(--soft); border-radius: 99px; overflow: hidden; margin-bottom: 18px; }
.progress > div { height: 100%; background: var(--accent); }
.prompt { font-size: 1.08rem; margin-bottom: 14px; }
.syl { list-style: none; padding: 0; margin: 0 0 16px; }
.syl li { background: var(--soft); border-radius: 10px; padding: 12px 14px; margin-bottom: 8px; }
.syl li b { margin-right: 6px; }
.opts { display: grid; gap: 10px; }
.opt { text-align: left; background: var(--surface); border: 2px solid var(--line); border-radius: 12px; padding: 12px 14px; }
.opt:hover { border-color: var(--accent); }
.opts.letters { grid-template-columns: repeat(5, 1fr); }
.opts.letters .opt { text-align: center; font-family: ui-monospace, Consolas, monospace; font-size: 1.15rem; letter-spacing: .12em; padding: 14px 4px; }
.opts.figs { grid-template-columns: repeat(5, 1fr); }
.opts.figs .opt { padding: 6px; display: flex; flex-direction: column; align-items: center; gap: 2px; }
.opts.figs .opt span { font-size: .8rem; color: var(--muted); }
.opts.figs svg { width: 100%; height: auto; max-width: 110px; }
.matrix { display: grid; grid-template-columns: repeat(3, 1fr); width: min(100%, 330px); margin: 0 auto 18px; border: 2px solid var(--ink); }
.matrix > div { aspect-ratio: 1; border: 1px solid var(--muted); display: flex; align-items: center; justify-content: center; }
.matrix svg { width: 92%; height: 92%; }
.matrix .q { font-size: 2rem; font-weight: 700; color: var(--accent); }
.numans { display: flex; gap: 10px; flex-wrap: wrap; }
.numans input { flex: 1 1 160px; font: inherit; font-size: 1.2rem; padding: 10px 14px; border: 2px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--ink); min-width: 0; }
.err { color: var(--bad); font-size: .9rem; min-height: 1.4em; margin-top: 6px; }

/* resultado */
.score { font-size: 3rem; font-weight: 800; line-height: 1; }
.bars { display: grid; gap: 10px; }
.bar { display: grid; grid-template-columns: 150px 1fr 92px; gap: 10px; align-items: center; font-size: .95rem; }
.bar .track { height: 12px; background: var(--soft); border-radius: 99px; overflow: hidden; }
.bar .fill { height: 100%; border-radius: 99px; }
.bar .num { text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); }
.weak { border-left: 4px solid var(--warn); }
.review { border-left: 4px solid var(--bad); }
.review .tag { font-size: .8rem; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.review .ans { margin: 10px 0; display: grid; gap: 4px; }
.good { color: var(--ok); font-weight: 600; }
.badt { color: var(--bad); font-weight: 600; }
.mini svg { width: 64px; height: 64px; vertical-align: middle; }
.mini { display: inline-flex; align-items: center; gap: 6px; }
.expl { background: var(--soft); border-radius: 10px; padding: 10px 12px; margin-top: 8px; }
table { width: 100%; border-collapse: collapse; font-size: .95rem; }
th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); }
th { color: var(--muted); font-weight: 600; }
td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; }

.lv { display:inline-block; font-size:.75rem; font-weight:700; padding:1px 8px; border-radius:99px; margin-left:4px; vertical-align:1px; }
.lv0 { background: color-mix(in srgb, var(--ok) 18%, transparent); color: var(--ok); }
.lv1 { background: color-mix(in srgb, var(--warn) 18%, transparent); color: var(--warn); }
.lv2 { background: color-mix(in srgb, var(--bad) 18%, transparent); color: var(--bad); }
.paused { border-left: 4px solid var(--accent); }
.lvrow { display:flex; flex-wrap:wrap; gap:8px 18px; margin-top:8px; font-size:.95rem; }
@media (max-width: 560px) {
  .opts.letters { grid-template-columns: 1fr 1fr; }
  .opts.figs { grid-template-columns: repeat(3, 1fr); }
  .bar { grid-template-columns: 1fr 80px; }
  .bar .track { grid-column: 1 / -1; grid-row: 2; }
  h1 { font-size: 1.45rem; }
}
</style>
</head>
<body>
<div id="app"></div>
<script>
/*GEN-START*/
function makeRng(seed) {
  let s = seed >>> 0;
  const next = () => {
    s = (s + 0x6D2B79F5) >>> 0;
    let t = s;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
  const int = (a, b) => a + Math.floor(next() * (b - a + 1));
  const pick = arr => arr[Math.floor(next() * arr.length)];
  const shuffle = arr => {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(next() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
    return a;
  };
  return { next, int, pick, shuffle };
}

const TYPES = ['silogismo', 'diagrama', 'matriz', 'padrao', 'problema'];
const TYPE_LABEL = { silogismo: 'Silogismos', diagrama: 'Diagramas', matriz: 'Matrizes', padrao: 'Padrões', problema: 'Resolução de problemas' };
const LEVEL_LABEL = ['fácil', 'médio', 'difícil'];
const GEN = {};

function parseAnswer(str) {
  let t = String(str == null ? '' : str).trim();
  if (/^\d{1,3}(\.\d{3})+$/.test(t)) t = t.replace(/\./g, '');
  if (!/^\d+$/.test(t)) return null;
  return parseInt(t, 10);
}

/* ================= RESOLUÇÃO DE PROBLEMAS ================= */
const NOMES = ['Ana', 'Bruno', 'Carla', 'Diego', 'Elisa', 'Felipe', 'Gabriela', 'Heitor', 'Isabela', 'João',
  'Larissa', 'Marcos', 'Natália', 'Otávio', 'Paula', 'Rafael', 'Sofia', 'Tiago'];
const dois = r => { const a = r.pick(NOMES); let b = r.pick(NOMES); while (b === a) b = r.pick(NOMES); return [a, b]; };

const PROB = {
  proporcao: r => {
    const pares = [['pacotes de clipes', 'resmas de papel'], ['caixas de grampos', 'cadernos'],
      ['canetas azuis', 'canetas vermelhas'], ['sacos de arroz', 'sacos de feijão'],
      ['camisetas', 'bonés'], ['copos', 'pratos'], ['pastas', 'envelopes']];
    const [A, B] = r.pick(pares);
    const a = r.int(2, 6); let b = r.int(2, 7); if (a === b) b++;
    const k = r.int(5, 60), X = a * k, ans = b * k;
    return { prompt: `Uma empresa compra ${A} e ${B} na proporção de ${a} ${A} para cada ${b} ${B}. Se ela comprou ${X} ${A}, qual a quantidade de ${B} comprada?`,
      answer: ans, explanation: `${X} ÷ ${a} = ${k} grupos. Cada grupo tem ${b} ${B}: ${k} × ${b} = ${ans}.` };
  },
  porcentagem: r => {
    const item = r.pick(['camisetas', 'livros', 'celulares', 'mochilas', 'cadeiras', 'garrafas']), p = r.pick([10, 20, 25, 30, 40, 50, 60, 75, 80]);
    const N = 20 * r.int(2, 30), vend = N * p / 100, resto = N - vend, perguntaResto = r.next() < 0.5;
    return { prompt: `Uma loja tinha ${N} ${item} em estoque e vendeu ${p}% desse estoque. ${perguntaResto ? 'Quantas unidades sobraram?' : 'Quantas unidades foram vendidas?'}`,
      answer: perguntaResto ? resto : vend,
      explanation: `${p}% de ${N} = ${N} × ${p} ÷ 100 = ${vend} vendidas.${perguntaResto ? ` Sobraram ${N} − ${vend} = ${resto}.` : ''}` };
  },
  preco: r => {
    const item = r.pick(['cadernos', 'canetas', 'pães', 'ingressos', 'camisetas', 'livros']), u = r.int(2, 15), n1 = r.int(2, 6);
    let n2 = r.int(3, 12); if (n2 === n1) n2++;
    return { prompt: `${n1} ${item} custam R$ ${u * n1}. Quanto custam ${n2} ${item}, em reais?`,
      answer: u * n2, explanation: `Cada um custa ${u * n1} ÷ ${n1} = ${u} reais. ${n2} × ${u} = ${u * n2}.` };
  },
  velocidade: r => {
    const v = 5 * r.int(4, 20), h1 = r.int(2, 5); let h2 = r.int(2, 8); if (h2 === h1) h2++;
    return { prompt: `Um carro percorre ${v * h1} km em ${h1} horas. Mantendo a mesma velocidade, quantos km ele percorre em ${h2} horas?`,
      answer: v * h2, explanation: `Velocidade: ${v * h1} ÷ ${h1} = ${v} km por hora. Em ${h2} horas: ${v} × ${h2} = ${v * h2} km.` };
  },
  caixas: r => {
    const c = r.int(6, 24), n = r.int(30, 300), q = Math.floor(n / c), resto = n % c, ans = resto ? q + 1 : q;
    return { prompt: `Cada caixa comporta ${c} ovos. Qual o menor número de caixas necessário para guardar ${n} ovos?`,
      answer: ans, explanation: resto ? `${n} ÷ ${c} = ${q} caixas cheias e sobram ${resto} ovos, que precisam de mais uma caixa: ${q} + 1 = ${ans}.` : `${n} ÷ ${c} = ${q} exatamente.` };
  },
  seqFacil: r => {
    const a = r.int(1, 20), d = r.int(2, 9), dec = r.next() < 0.3;
    const seq = [0, 1, 2, 3, 4].map(i => dec ? a + 5 * d - d * i : a + d * i); // decrescente: próximo termo = a > 0
    const nxt = dec ? seq[4] - d : seq[4] + d;
    return { prompt: `Qual o próximo número da sequência: ${seq.join(', ')}, ...?`, answer: nxt,
      explanation: `A sequência ${dec ? 'diminui' : 'aumenta'} ${d} a cada termo: ${seq[4]} ${dec ? '−' : '+'} ${d} = ${nxt}.`, data: { seq } };
  },
  inversa: r => {
    for (;;) {
      const w = r.int(2, 8), d = r.int(3, 15), total = w * d, cands = [];
      for (let W = 2; W <= 24; W++) if (W !== w && total % W === 0 && total / W !== d) cands.push(W);
      if (!cands.length) continue;
      const W = r.pick(cands), D = total / W;
      return { prompt: `${w} pedreiros constroem um muro em ${d} dias. Trabalhando no mesmo ritmo, em quantos dias ${W} pedreiros construiriam o mesmo muro?`,
        answer: D, explanation: `Mais gente = menos dias (inversa). Trabalho total: ${w} × ${d} = ${total}. Dividindo por ${W}: ${total} ÷ ${W} = ${D}.` };
    }
  },
  idadeDobro: r => {
    const nome = r.pick(NOMES), x = r.int(4, 15), t = r.int(Math.max(1, 20 - x), 25), y = 2 * x + t;
    return { prompt: `${nome} tem ${x} anos e o pai tem ${y}. Daqui a quantos anos o pai terá o dobro da idade de ${nome}?`,
      answer: t, explanation: `Daqui a t anos: ${y} + t = 2 × (${x} + t) → ${y} + t = ${2 * x} + 2t → t = ${y} − ${2 * x} = ${t}.` };
  },
  somaDif: r => {
    const novo = r.int(3, 30), D = r.int(1, 15), velho = novo + D, S = novo + velho;
    return { prompt: `A soma das idades de dois irmãos é ${S} e a diferença entre elas é ${D}. Qual a idade do mais velho?`,
      answer: velho, explanation: `Mais velho = (soma + diferença) ÷ 2 = (${S} + ${D}) ÷ 2 = ${velho}.` };
  },
  fracoes: r => {
    const fr = [[2, 'metade'], [3, 'um terço'], [4, 'um quarto']];
    const [d1, t1] = r.pick(fr), [d2, t2] = r.pick(fr);
    const X = 10 * r.int(2, 30) * d1 * d2, g1 = X / d1, r1 = X - g1, g2 = r1 / d2, ans = r1 - g2;
    return { prompt: `${r.pick(NOMES)} recebeu R$ ${X}. Gastou ${t1} com aluguel e ${t2} do que sobrou com comida. Quantos reais sobraram?`,
      answer: ans, explanation: `Aluguel: ${X} ÷ ${d1} = ${g1}, sobram ${r1}. Comida: ${r1} ÷ ${d2} = ${g2}. Sobram ${r1} − ${g2} = ${ans}.` };
  },
  producao: r => {
    const p = r.int(2, 12), m = r.pick([2, 3, 4, 5, 6, 10, 12, 15, 20, 30]), H = r.int(1, 5), ph = p * (60 / m), ans = ph * H;
    return { prompt: `Uma máquina produz ${p} peças a cada ${m} minutos. Quantas peças ela produz em ${H} hora${H > 1 ? 's' : ''}?`,
      answer: ans, explanation: `Em 1 hora cabem 60 ÷ ${m} = ${60 / m} ciclos: ${60 / m} × ${p} = ${ph} peças por hora. Em ${H} h: ${ph} × ${H} = ${ans}.` };
  },
  media: r => {
    for (;;) {
      const notas = [r.int(4, 9), r.int(4, 9), r.int(4, 9)], S = notas[0] + notas[1] + notas[2], m = r.int(5, 9), ans = 4 * m - S;
      if (ans < 1 || ans > 10) continue;
      const nome = r.pick(NOMES);
      return { prompt: `As notas de ${nome} nas três primeiras provas foram ${notas.join(', ')}. Quanto ${nome} precisa tirar na quarta prova para ficar com média ${m}?`,
        answer: ans, explanation: `Média ${m} em 4 provas = soma ${4 * m}. Já tem ${notas.join(' + ')} = ${S}. Falta ${4 * m} − ${S} = ${ans}.` };
    }
  },
  seqMedia: r => {
    const tipo = r.int(0, 2);
    if (tipo === 0) { const a = r.int(1, 5), k = r.pick([2, 3]); const seq = [0, 1, 2, 3, 4].map(i => a * k ** i);
      return { prompt: `Qual o próximo número da sequência: ${seq.join(', ')}, ...?`, answer: seq[4] * k, explanation: `Cada termo é o anterior × ${k}: ${seq[4]} × ${k} = ${seq[4] * k}.`, data: { seq } }; }
    if (tipo === 1) { const a = r.int(1, 10), d = r.int(1, 4); const seq = [a]; for (let i = 1; i < 5; i++) seq.push(seq[i - 1] + d * i);
      return { prompt: `Qual o próximo número da sequência: ${seq.join(', ')}, ...?`, answer: seq[4] + d * 5, explanation: `As diferenças crescem: +${d}, +${2 * d}, +${3 * d}, +${4 * d}; a próxima é +${5 * d}: ${seq[4]} + ${5 * d} = ${seq[4] + 5 * d}.`, data: { seq } }; }
    const a = r.int(2, 9), b = r.int(2, 9), c = r.int(2, 9); // duas sequências intercaladas
    const seq = [a, 20 + b, a + c, 20 + b - 2, a + 2 * c];
    return { prompt: `Qual o próximo número da sequência: ${seq.join(', ')}, ...?`, answer: 20 + b - 4,
      explanation: `São duas sequências intercaladas: posições ímpares ${a}, ${a + c}, ${a + 2 * c} (+${c}) e pares ${20 + b}, ${18 + b} (−2). O próximo é da segunda: ${18 + b} − 2 = ${16 + b}.`, data: { seq } };
  },
  torneiras: r => {
    for (;;) {
      const t = r.int(2, 12), a = r.int(t + 1, 4 * t), b = a * t / (a - t);
      if (!Number.isInteger(b) || b <= a) continue;
      return { prompt: `Uma torneira enche um tanque em ${a} horas e outra enche o mesmo tanque em ${b} horas. Abertas juntas, em quantas horas elas enchem o tanque?`,
        answer: t, explanation: `Em 1 hora: 1/${a} + 1/${b} = ${a + b}/${a * b} = 1/${t} do tanque. Logo, ${t} horas.`, data: { a, b } };
    }
  },
  trabalho: r => {
    for (;;) {
      const t = r.int(2, 12), a = r.int(t + 1, 4 * t), b = a * t / (a - t);
      if (!Number.isInteger(b) || b <= a) continue;
      const [p1, p2] = dois(r);
      return { prompt: `${p1} consegue pintar uma casa em ${a} dias; ${p2}, em ${b} dias. Trabalhando juntos, no mesmo ritmo, em quantos dias pintam a casa?`,
        answer: t, explanation: `Por dia: 1/${a} + 1/${b} = ${a + b}/${a * b} = 1/${t} da casa. Logo, ${t} dias.`, data: { a, b } };
    }
  },
  encontro: r => {
    const v1 = 10 * r.int(4, 10), v2 = 10 * r.int(4, 10), T = r.int(1, 5), D = T * (v1 + v2);
    return { prompt: `Duas cidades ficam a ${D} km uma da outra. Ao mesmo tempo, sai um carro de cada cidade, um em direção ao outro, a ${v1} km/h e a ${v2} km/h. Em quantas horas eles se encontram?`,
      answer: T, explanation: `Eles se aproximam a ${v1} + ${v2} = ${v1 + v2} km/h. Tempo: ${D} ÷ ${v1 + v2} = ${T} h.`, data: { D, v1, v2 } };
  },
  encontro2: r => {
    const v1 = 10 * r.int(4, 10), v2 = 10 * r.int(4, 10), T = r.int(2, 5), D = T * (v1 + v2);
    return { prompt: `Duas cidades ficam a ${D} km uma da outra. Ao mesmo tempo, sai um carro de cada cidade, um em direção ao outro: o primeiro a ${v1} km/h e o segundo a ${v2} km/h. Quantos km o primeiro carro terá percorrido quando eles se encontrarem?`,
      answer: v1 * T, explanation: `Juntos se aproximam ${v1 + v2} km/h, então se encontram em ${D} ÷ ${v1 + v2} = ${T} h. O primeiro anda ${v1} × ${T} = ${v1 * T} km.` };
  },
  descontos: r => {
    for (;;) {
      const P = 100 * r.int(2, 20), d1 = r.pick([10, 20, 25, 50]), d2 = r.pick([10, 20, 25, 50]);
      const p1 = P * (100 - d1) / 100, fin = p1 * (100 - d2) / 100;
      if (!Number.isInteger(p1) || !Number.isInteger(fin)) continue;
      return { prompt: `Um produto custava R$ ${P}. Recebeu um desconto de ${d1}% e, depois, mais ${d2}% de desconto sobre o novo preço. Qual o preço final, em reais?`,
        answer: fin, explanation: `${P} − ${d1}% = ${p1}. Depois ${p1} − ${d2}% = ${fin}. (Cuidado: não é ${d1 + d2}% de uma vez, que daria ${P * (100 - d1 - d2) / 100}.)` };
    }
  },
  juros: r => {
    for (;;) {
      const C = 100 * r.int(2, 50), i = r.int(1, 10), n = r.int(2, 12), J = C * i * n / 100;
      if (!Number.isInteger(J)) continue;
      const askM = r.next() < 0.6;
      return { prompt: `Uma aplicação de R$ ${C} rende juros simples de ${i}% ao mês. ${askM ? `Qual o valor total (montante) após ${n} meses?` : `Quantos reais de juros ela rende em ${n} meses?`}`,
        answer: askM ? C + J : J, explanation: `Juros por mês: ${i}% de ${C} = ${C * i / 100}. Em ${n} meses: ${C * i / 100} × ${n} = ${J}.${askM ? ` Montante: ${C} + ${J} = ${C + J}.` : ''}` };
    }
  },
  lucro: r => {
    for (;;) {
      const C = 20 * r.int(2, 50), p = r.pick([10, 20, 25, 30, 40, 50]), V = C * (100 + p) / 100;
      if (!Number.isInteger(V)) continue;
      return { prompt: `Uma loja vendeu um produto por R$ ${V}, tendo lucro de ${p}% sobre o preço de custo. Qual era o preço de custo, em reais?`,
        answer: C, explanation: `Venda = custo × ${(100 + p) / 100}. Custo = ${V} ÷ ${(100 + p) / 100} = ${C}. (Cuidado: tirar ${p}% de ${V} daria outro valor.)` };
    }
  },
  idade2: r => {
    const [a, b] = dois(r), m = r.pick([2, 3, 4]), b0 = r.int(2, 9), a0 = m * b0, x = r.int(3, 12), A = a0 + x, B = b0 + x;

/* ================= MATRIZES ================= */
const ATTRS = ['shape', 'size', 'count', 'fill', 'rot'];
const ATTR_VALUES = { shape: ['circle', 'square', 'triangle', 'star', 'arrow'], size: [1, 2, 3], count: [1, 2, 3], fill: ['none', 'half', 'solid'], rot: [0, 90, 180, 270] };
const ROT_SHAPES = ['triangle', 'arrow'];
const ATTR_NAME = { shape: 'forma', size: 'tamanho', count: 'quantidade', fill: 'preenchimento', rot: 'rotação' };
const ATTR_ART = { shape: 'a', size: 'o', count: 'a', fill: 'o', rot: 'a' };
const SHAPE_NAME = { circle: 'círculo', square: 'quadrado', triangle: 'triângulo', star: 'estrela', arrow: 'seta' };
const VAL_LABEL = {
  shape: v => SHAPE_NAME[v], size: v => ({ 1: 'pequeno', 2: 'médio', 3: 'grande' })[v], count: v => String(v),
  fill: v => ({ none: 'vazio', half: 'meio cheio', solid: 'cheio' })[v], rot: v => `${v}°`,
};
function canon(c) { const o = { ...c }; if (!ROT_SHAPES.includes(o.shape)) o.rot = 0; return o; }

  if (ka === 'fig') { a = canon(a); b = canon(b); return ATTRS.every(k => a[k] === b[k]); }
  if (ka === 'lines') return a.m === b.m;
  if (ka === 'dot') return a.p === b.p && a.q === b.q;
  return a.n === b.n && a.shape === b.shape;
}
function ruleVal(rule, row, col) {
  if (rule.kind === 'linha') return rule.vals[col];
  if (rule.kind === 'coluna') return rule.vals[row];
  return rule.vals[(row + col) % 3];
}
function cellSolves(grid, cell, rules) {
  const cells = [...grid, cell];
  if (cells.some(c => (c.kind || 'fig') !== 'fig')) return false;
  for (let i = 0; i < 9; i++) {
    const exp = { ...cells[0] };
    for (const ru of rules) exp[ru.attr] = ruleVal(ru, Math.floor(i / 3), i % 3);
    if (!cellEq(exp, cells[i])) return false;

}

  const o = fem ? 'a' : 'o';
  const tam = c.size === 3 ? 'grande' + (n > 1 ? 's' : '') : (c.size === 1 ? 'pequen' : 'médi') + o + pl;
  const fill = c.fill === 'none' ? `vazi${o}${pl}` : c.fill === 'half' ? `meio chei${o}${pl}` : `chei${o}${pl}`;
  let t = `${n} ${nome} ${tam}, ${fill}`;

}

  if (ru.kind === 'coluna') return `Cada linha tem ${art === 'a' ? 'a sua' : 'o seu'} ${nm}: ${lb[0]} na 1ª, ${lb[1]} na 2ª e ${lb[2]} na 3ª.`;

function pickDistractors(r, ans, pool) {

// modo "fig": regras sobre forma/tamanho/quantidade/preenchimento/rotação
function genFig(r, nRules, kinds, subtle) {
  for (;;) {
    const attrs = r.shuffle(ATTRS).slice(0, nRules);
    if (attrs.includes('shape') && attrs.includes('rot')) continue;
    const rules = attrs.map(attr => {
      const kind = r.pick(kinds);
      let vals;
      if (attr === 'size' || attr === 'count') vals = kind === 'rodizio' ? r.shuffle([1, 2, 3]) : (r.next() < 0.5 ? [3, 2, 1] : [1, 2, 3]);
      else if (attr === 'rot') { const s = r.pick(ATTR_VALUES.rot), d = r.pick([90, 270]); vals = [s, (s + d) % 360, (s + 2 * d) % 360]; }
      else vals = r.shuffle(ATTR_VALUES[attr]).slice(0, 3);
      return { kind, attr, vals };
    });
    const base = { shape: attrs.includes('rot') ? r.pick(ROT_SHAPES) : r.pick(ATTR_VALUES.shape),
      size: r.pick([2, 2, 3]), count: r.pick([1, 1, 1, 2, 3]), fill: r.pick(ATTR_VALUES.fill), rot: 0 };
    if (!attrs.includes('shape') && ROT_SHAPES.includes(base.shape)) base.rot = r.pick(ATTR_VALUES.rot);
    const cells = [];
    for (let i = 0; i < 9; i++) { const c = { ...base }; for (const ru of rules) c[ru.attr] = ruleVal(ru, Math.floor(i / 3), i % 3); cells.push(c); }
    const ans = cells[8];
    const mk = attr => ATTR_VALUES[attr].filter(v => v !== ans[attr]).map(v => ({ ...ans, [attr]: v }));
    let pool;
    if (subtle) {
      // pegadinhas: valores que aparecem na própria matriz, só nos atributos das regras
      const singles = r.shuffle(attrs.flatMap(a => rules.find(x => x.attr === a).vals.filter(v => v !== ans[a]).map(v => ({ ...ans, [a]: v }))));
      const doubles = [];
      for (let i = 0; i < attrs.length; i++) for (let j = i + 1; j < attrs.length; j++)
        for (const a of mk(attrs[i])) for (const v of ATTR_VALUES[attrs[j]]) if (v !== ans[attrs[j]]) doubles.push({ ...a, [attrs[j]]: v });
      pool = [...singles, ...r.shuffle(doubles), ...r.shuffle(attrs.flatMap(mk))];
    } else {
      const ruled = r.shuffle(attrs.flatMap(mk)), other = r.shuffle(ATTRS.filter(a => !attrs.includes(a)).flatMap(mk));
      pool = [...ruled.slice(0, 2), ...r.shuffle([...ruled.slice(2), ...other])];
    }
    const distract = pickDistractors(r, ans, pool);
    if (!distract) continue;
    return finishMatrix(r, 'fig', cells, ans, distract, `${rules.map(ruleText).join(' ')} O resto não muda. Resposta: ${describeCell(ans)}.`, { rules });
  }
}

// modo "overlay": traços que se somam (OU) ou se cancelam (OU exclusivo)
const popc = m => { let n = 0; while (m) { n += m & 1; m >>= 1; } return n; };
const OVL = { or: (a, b) => a | b, xor: (a, b) => a ^ b };
function genOverlay(r) {
  const randMask = () => { let m = 0; for (const b of r.shuffle([0, 1, 2, 3, 4, 5, 6, 7]).slice(0, r.int(2, 4))) m |= 1 << b; return m; };
  for (;;) {
    const op = r.pick(['or', 'xor']), f = OVL[op], rows = [];
    let ok = true;
    for (let i = 0; i < 3 && ok; i++) {
      const A = randMask(), B = randMask(), C = f(A, B);
      if (A === B || C === A || C === B || popc(C) < 2) ok = false;
      rows.push([A, B, C]);
    }
    if (!ok || !((rows[0][0] & rows[0][1]) || (rows[1][0] & rows[1][1]))) continue;
    if (!(rows[2][0] & rows[2][1])) continue; // a resposta também testa a regra
    const cells = rows.flat().map(m => ({ kind: 'lines', m })), ans = cells[8];
    const [A, B] = rows[2], other = op === 'or' ? A ^ B : A | B;
    const toggles = r.shuffle([0, 1, 2, 3, 4, 5, 6, 7].map(b => ans.m ^ (1 << b)).filter(m => m));
    const pool = [other, A & B, ...toggles.slice(0, 2), A, B, ...toggles.slice(2)].filter(m => m).map(m => ({ kind: 'lines', m }));
    const distract = pickDistractors(r, ans, pool);
    if (!distract) continue;
    const ex = op === 'or'
      ? 'Em cada linha, a 3ª figura é a SOMA das duas primeiras: junta todos os traços da 1ª e da 2ª (os repetidos aparecem uma vez só).'
      : 'Em cada linha, a 3ª figura mostra só os traços que aparecem em APENAS UMA das duas primeiras; os traços que aparecem nas duas se cancelam e somem.';
    return finishMatrix(r, 'overlay', cells, ans, distract, ex, { op });
  }
}

// modo "move": ponto (e losango) andando pela borda da célula
function genMove(r) {
  for (;;) {
    const k = r.pick([1, 2, 3]), useQ = r.next() < 0.65, j = r.pick([1, 2]);
    const starts = r.shuffle([0, 1, 2, 3, 4, 5, 6, 7]).slice(0, 3), qs = [r.int(0, 7), r.int(0, 7), r.int(0, 7)];
    const cells = [];
    for (let row = 0; row < 3; row++) for (let col = 0; col < 3; col++)
      cells.push({ kind: 'dot', p: (starts[row] + k * col) % 8, q: useQ ? (qs[row] - j * col + 16) % 8 : -1 });
    if (cells.some(c => c.p === c.q)) continue;
    const ans = cells[8], P = ans.p, Q = ans.q;
    const ps = [(P + 1) % 8, (P + 7) % 8, (P + k) % 8, (P + 8 - k) % 8, (P + 4) % 8];
    let pool;
    if (useQ) pool = [{ kind: 'dot', p: Q, q: P }, { kind: 'dot', p: P, q: (Q + 2 * j) % 8 }, { kind: 'dot', p: P, q: (Q + 1) % 8 },
      ...ps.map(p => ({ kind: 'dot', p, q: Q })), { kind: 'dot', p: P, q: (Q + 7) % 8 }];
    else pool = ps.map(p => ({ kind: 'dot', p, q: -1 })).concat([2, 3, 5, 6].map(d => ({ kind: 'dot', p: (P + d) % 8, q: -1 })));
    pool = pool.filter(c => c.p !== c.q);
    const distract = pickDistractors(r, ans, r.shuffle(pool.slice(0, 4)).concat(pool.slice(4)));
    if (!distract) continue;
    const casas = n => `${n} casa${n > 1 ? 's' : ''}`;
    const ex = `Em cada linha, o ponto preto anda ${casas(k)} no sentido horário pela borda a cada coluna.` +
      (useQ ? ` O losango anda ${casas(j)} no sentido anti-horário.` : '');
    return finishMatrix(r, 'move', cells, ans, distract, ex, { k, j: useQ ? j : 0 });
  }
}

// modo "count": quantidade da 3ª = soma ou diferença das duas primeiras
function genCount(r) {
  for (;;) {
    const op = r.pick(['+', '-']), shape = r.pick(['circle', 'square', 'star', 'triangle']), rows = [];
    for (let i = 0; i < 3; i++) {
      if (op === '+') { const a = r.int(1, 6), b = r.int(1, 9 - a); rows.push([a, b, a + b]); }
      else { const a = r.int(3, 9), b = r.int(1, a - 1); rows.push([a, b, a - b]); }
    }
    const ex2 = rows.slice(0, 2);
    if (ex2[0][2] === ex2[1][2]) continue;
    if (op === '+' && !ex2.some(([a, b]) => a * b !== a + b)) continue;
    if (op === '-' && !ex2.some(([a, b]) => a / b !== a - b)) continue;
    if (rows.some(([a, b]) => a === b)) continue;
    const cells = rows.flat().map(n => ({ kind: 'count', n, shape })), ans = cells[8], n = ans.n;
    const [a, b] = rows[2], alt = op === '+' ? Math.abs(a - b) : a + b;
    const pool = [alt, n + 1, n - 1, n + 2, n - 2, a, b].filter(v => v >= 1 && v <= 9).map(v => ({ kind: 'count', n: v, shape }));
    const distract = pickDistractors(r, ans, pool);
    if (!distract) continue;
    const ex = op === '+'
      ? `Em cada linha, a quantidade da 3ª figura é a SOMA das duas primeiras (ex.: ${rows[0][0]} + ${rows[0][1]} = ${rows[0][2]}). Na última: ${a} + ${b} = ${n}.`
      : `Em cada linha, a quantidade da 3ª figura é a 1ª MENOS a 2ª (ex.: ${rows[0][0]} − ${rows[0][1]} = ${rows[0][2]}). Na última: ${a} − ${b} = ${n}.`;
    return finishMatrix(r, 'count', cells, ans, distract, ex, { op });
  }
}

GEN.matriz = (r, lv) => {
  if (lv === 0) return genFig(r, 1, ['linha', 'linha', 'coluna'], false);
  if (lv === 1) return genFig(r, 2, ['linha', 'coluna', 'rodizio', 'rodizio'], true);
  const mode = r.pick(['overlay', 'move', 'count', 'fig']);
  if (mode === 'overlay') return genOverlay(r);
  if (mode === 'move') return genMove(r);
  if (mode === 'count') return genCount(r);
  return genFig(r, 3, ['linha', 'coluna', 'rodizio', 'rodizio'], true);
};

function matrixSolves(q, cell) {
  const d = q.data, cells = [...d.grid, cell];
  if (d.mode === 'fig') return cellSolves(d.grid, cell, d.rules);
  for (let row = 0; row < 3; row++) {
    const [a, b, c] = cells.slice(row * 3, row * 3 + 3);
    if (d.mode === 'overlay') { if (c.kind !== 'lines' || OVL[d.op](a.m, b.m) !== c.m) return false; }
    else if (d.mode === 'count') {
      if (c.kind !== 'count' || c.shape !== a.shape) return false;
      if ((d.op === '+' ? a.n + b.n : a.n - b.n) !== c.n) return false;
    } else if (d.mode === 'move') {
      if (c.kind !== 'dot') return false;
      for (const [x, y] of [[a, b], [b, c]]) {
        if (y.p !== (x.p + d.k) % 8) return false;
        if (d.j ? y.q !== (x.q - d.j + 16) % 8 : y.q !== -1) return false;
      }
    }
  }
  return true;
}

/* ================= TEXTOS ================= */
const TIPS = {
  silogismo: 'Ignore se a frase faz sentido no mundo real: avalie só a lógica. Troque por nomes conhecidos (ex.: "todos os cães são animais"). "Todo A é B" NÃO quer dizer "todo B é A". Dois "alguns" nunca garantem conclusão. Se conseguir imaginar um caso em que as premissas valem e a conclusão não, ela está errada. Considere sempre que cada grupo tem pelo menos um elemento.',
  diagrama: 'Para cada par de grupos, pergunte: um está todo dentro do outro? Eles se cruzam (alguns são os dois)? Ou não têm nada em comum? Depois procure o desenho com essas três relações. O tamanho dos círculos não importa.',
  matriz: 'Olhe uma linha de cada vez e teste, nesta ordem: (1) o que muda da esquerda para a direita (tamanho, quantidade, preenchimento, giro, forma)? (2) cada linha tem as 3 versões de algo, trocando de lugar? (3) a 3ª é a 1ª + a 2ª juntas, ou só o que não se repete? (4) algo anda pela borda? (5) as quantidades somam ou subtraem? Confirme a regra na 2ª linha antes de aplicar na 3ª, e compare as alternativas detalhe por detalhe.',
  padrao: 'Pense nas letras como posições (A=1, B=2, C=3…) e anote os saltos entre elas (+1, +2, −1…). Os saltos podem ser iguais, crescer (1,2,3) ou alternar. Procure também letras repetidas, conjuntos espelhados (ABBA), letras opostas no alfabeto (A↔Z, B↔Y) e onde estão as vogais. Confira se a regra vale para exatamente 4 conjuntos.',
  problema: 'Anote os números e descubra quanto vale "1 unidade" (1 hora, 1 item, 1 dia). Trabalho junto: some o que cada um faz em 1 hora (1/a + 1/b). Encontro: some as velocidades. Descontos seguidos: aplique um de cada vez. Sequências: olhe as diferenças entre os termos; se não for constante, olhe a diferença das diferenças, multiplicações ou duas sequências intercaladas.',
};
const TYPE_INTRO = {
  silogismo: 'Duas frases com premissas e uma conclusão. Diga quais têm lógica correta.',
  diagrama: 'Três grupos: escolha o desenho de círculos que mostra a relação entre eles.',
  matriz: 'Grade 3×3 de figuras: escolha a que completa o "?".',
  padrao: 'Cinco conjuntos de 4 letras: marque o que não segue a regra dos outros.',
  problema: 'Contas de proporção, porcentagem, trabalho, encontro e sequências; a resposta é um número inteiro.',
};
const esc = s => String(s).replace(/[&<>"]/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[ch]);
const secs = ms => (ms / 1000).toFixed(0) + ' s';
const pct = (a, b) => b ? Math.round(100 * a / b) : 0;
const barColor = p => p >= 75 ? 'var(--ok)' : p >= 50 ? 'var(--warn)' : 'var(--bad)';
const lvBadge = lv => `<span class="lv lv${lv}">${LEVEL_LABEL[lv]}</span>`;
const modeName = (mode, n) => mode === 'teste' ? (n ? `Teste ${n}` : 'Teste') : `Treino · ${TYPE_LABEL[mode.split(':')[1]]}`;

/* ================= TELAS ================= */
const app = document.getElementById('app');
const QUESTION_MS = 90000;
let run = null;

function show(html) { app.innerHTML = html; window.scrollTo(0, 0); }

function homeScreen() {
  stopTimer(); run = null;
  const h = Store.load(), paused = RunStore.load();
  const last = h.tests.filter(t => t.mode === 'teste').slice(-1)[0];
  show(`
    <h1>Treino de Lógica</h1>
    <p class="muted">Simulado do teste de raciocínio: 90 segundos por questão, sem voltar. É adaptativo como a prova: acertou, a próxima do mesmo tipo fica mais difícil; errou, fica mais fácil.</p>
    ${paused ? `<div class="card paused">
      <b>Você tem um teste pausado</b>
      <p class="muted" style="margin:4px 0 12px">${modeName(paused.mode)} · questão ${paused.i + 1} de ${paused.plan.length} · ${Math.ceil((paused.remaining == null ? QUESTION_MS : paused.remaining) / 1000)} s restantes nessa questão</p>
      <div class="row"><button class="btn primary" data-act="resume">Continuar teste</button><button class="btn link" data-act="discard">Descartar</button></div>
    </div>` : ''}
    <div class="card">
      <button class="btn ${paused ? '' : 'primary'} big" data-act="test">Novo teste · 20 questões</button>
      <p class="muted" style="margin:10px 0 0;font-size:.9rem">4 de cada tipo, misturadas · começa no nível médio · até 30 min${last ? ` · último: Teste ${last.n} (${last.items.filter(i => i.correct).length}/${last.items.length})` : ''}</p>
    </div>
    <h2>Treino por tipo · 10 questões</h2>
    <div class="drills">
      ${TYPES.map(t => `<button class="btn" data-act="drill" data-type="${t}">${TYPE_LABEL[t]}</button>`).join('')}
    </div>
    <h2>Seu progresso</h2>
    <button class="btn" data-act="stats">Meu desempenho${h.tests.length ? ` (${h.tests.length} feitos)` : ''}</button>
    <h2>Como funciona cada tipo</h2>
    <div class="card" style="padding-top:6px;padding-bottom:6px">
      ${TYPES.map(t => `<details><summary>${TYPE_LABEL[t]}</summary><p><b>${TYPE_INTRO[t]}</b><br>${TIPS[t]}</p></details>`).join('')}
    </div>
  `);
}

function newRng() { return makeRng((Math.random() * 2 ** 32) >>> 0); }

function startRun(mode) {
  if (RunStore.load() && !confirm('Você tem um teste pausado. Começar outro vai descartá-lo. Continuar?')) return;
  RunStore.clear();
  const rng = newRng();
  const levels = {}; TYPES.forEach(t => { levels[t] = 1; });
  run = { mode, plan: buildPlan(mode, rng), i: 0, items: [], levels, current: null, remaining: null, rng, seen: new Set() };
  showQuestion();
}

function resumeRun() {
  const s = RunStore.load();
  if (!s) { homeScreen(); return; }
  run = { ...s, rng: newRng(), seen: new Set(s.items.map(it => it.q.type + ':' + it.q.prompt)) };
  showQuestion();
}

function snapshot() {
  if (!run) return;
  const remaining = run.deadline && !run.answered ? Math.max(0, run.deadline - Date.now()) : run.remaining;
  RunStore.save({ mode: run.mode, plan: run.plan, i: run.i, items: run.items, levels: run.levels, current: run.current, remaining });
}

function stopTimer() { if (run && run.timer) { clearInterval(run.timer); run.timer = null; } }

function sylHtml(items) {
  return '<ol class="syl">' + items.map((it, k) =>
    `<li><b>${k + 1}.</b>${esc(it.premises.join('. '))}. Assim sendo, ${esc(it.conclusion.charAt(0).toLowerCase() + it.conclusion.slice(1))}.</li>`).join('') + '</ol>';
}
function matrixHtml(grid, width) {
  return `<div class="matrix"${width ? ` style="width:min(100%,${width}px)"` : ''}>` + grid.map(c => `<div>${cellSvg(c)}</div>`).join('') + '<div class="q">?</div></div>';
}

function questionBody(q) {
  let h = '';
  if (q.type === 'silogismo') {
    h += `<p class="prompt">${esc(q.prompt)}</p>` + sylHtml(q.data.items);
    h += `<div class="opts">${q.options.map((o, k) => `<button class="opt" data-ans="${k}">${esc(o)}</button>`).join('')}</div>`;
  } else if (q.type === 'padrao') {
    h += `<p class="prompt">${esc(q.prompt)}</p>`;
    h += `<div class="opts letters">${q.options.map((o, k) => `<button class="opt" data-ans="${k}">${esc(o)}</button>`).join('')}</div>`;
  } else if (q.type === 'diagrama') {
    h += `<p class="prompt">Qual diagrama representa melhor a relação entre: <b>${esc(q.data.groups.join(', '))}</b>?</p>`;
    h += `<div class="opts figs">${q.options.map((o, k) => `<button class="opt" data-ans="${k}" aria-label="Diagrama ${k + 1}">${diagramSvg(o)}<span>${k + 1}</span></button>`).join('')}</div>`;
  } else if (q.type === 'matriz') {
    h += `<p class="prompt">${esc(q.prompt)}</p>` + matrixHtml(q.data.grid);
    h += `<div class="opts figs">${q.options.map((o, k) => `<button class="opt" data-ans="${k}" aria-label="Alternativa ${k + 1}">${cellSvg(o)}<span>${k + 1}</span></button>`).join('')}</div>`;
  } else {
    h += `<p class="prompt">${esc(q.prompt)}</p>
      <form class="numans" data-form="num" autocomplete="off">
        <input id="numin" inputmode="numeric" placeholder="Digite um número inteiro" aria-label="Resposta">
        <button class="btn primary" type="submit">Responder</button>
      </form><div class="err" id="numerr"></div>`;
  }
  return h;
}

function showQuestion() {
  stopTimer();
  const n = run.plan.length;
  if (!run.current) {
    const type = run.plan[run.i];
    run.current = genQuestion(type, run.levels[type], run.rng, run.seen);
    run.remaining = null;
  }
  const q = run.current, budget = run.remaining == null ? QUESTION_MS : run.remaining;
  run.answered = false;
  run.qStart = Date.now() - (QUESTION_MS - budget);
  run.deadline = Date.now() + budget;
  run.readyAt = Date.now() + 600;
  run.lastSave = 0;
  snapshot();
  show(`
    <div class="qhead">
      <div class="qmeta">Questão <b>${run.i + 1}/${n}</b> · ${TYPE_LABEL[q.type]} ${lvBadge(q.level)}</div>
      <div class="timer" id="timer">1:30</div>
    </div>
    <div class="progress"><div style="width:${100 * run.i / n}%"></div></div>
    <div class="card">${questionBody(q)}</div>
    <div class="row" style="justify-content:space-between">
      <button class="btn" data-act="pause">⏸ Pausar</button>
      <button class="btn link" data-act="quit">Desistir do teste</button>
    </div>
  `);
  const inp = document.getElementById('numin');
  if (inp) inp.focus();
  run.timer = setInterval(tick, 250);
  tick();
}

function tick() {
  if (!run || run.answered) return;
  const left = Math.max(0, run.deadline - Date.now());
  const s = Math.ceil(left / 1000);
  const el = document.getElementById('timer');
  if (el) { el.textContent = `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; el.classList.toggle('low', s <= 15); }
  if (left <= 0) { answer(null, true); return; }
  if (Date.now() - run.lastSave > 2000) { run.lastSave = Date.now(); snapshot(); }
}

function answer(resp, timeout) {
  if (!run || run.answered) return;
  if (!timeout && Date.now() < run.readyAt) return;
  if (Date.now() >= run.deadline) { resp = null; timeout = true; }
  run.answered = true;
  stopTimer();
  const q = run.current, correct = isCorrect(q, resp);
  run.items.push({ q, resp, correct, ms: Math.min(QUESTION_MS, Date.now() - run.qStart), timeout: !!timeout, level: q.level });
  run.levels[q.type] = nextLevel(run.levels[q.type], correct);
  run.current = null; run.remaining = null; run.i++;
  if (run.i < run.plan.length) showQuestion(); else finishRun();
}

function pauseRun() {
  if (!run) return;
  run.remaining = Math.max(0, run.deadline - Date.now());
  stopTimer();
  RunStore.save({ mode: run.mode, plan: run.plan, i: run.i, items: run.items, levels: run.levels, current: run.current, remaining: run.remaining });
  run = null;
  homeScreen();
}

function finishRun() {
  RunStore.clear();
  const h = Store.load();
  const rec = { n: run.mode === 'teste' ? h.nextN : null, date: new Date().toISOString(), mode: run.mode,
    items: run.items.map(it => ({ type: it.q.type, correct: it.correct, ms: it.ms, timeout: it.timeout, level: it.level })) };
  if (run.mode === 'teste') h.nextN = (h.nextN || 1) + 1;
  h.tests.push(rec);
  const saved = Store.save(h);
  const r = run; run = null;
  resultScreen(r, rec, saved);
}

function typeBars(items) {
  return TYPES.filter(t => items.some(i => i.type === t)).map(t => {
    const its = items.filter(i => i.type === t), ok = its.filter(i => i.correct).length, p = pct(ok, its.length);
    const avg = its.reduce((s, i) => s + i.ms, 0) / its.length;
    return `<div class="bar"><div>${TYPE_LABEL[t]}</div>
      <div class="track"><div class="fill" style="width:${Math.max(p, 2)}%;background:${barColor(p)}"></div></div>
      <div class="num">${ok}/${its.length} · ${secs(avg)}</div></div>`;
  }).join('');
}
function weakest(items, minN) {
  let best = null;
  for (const t of TYPES) {
    const its = items.filter(i => i.type === t);
    if (its.length < minN) continue;
    const p = pct(its.filter(i => i.correct).length, its.length);
    if (p < 100 && (!best || p < best.p)) best = { t, p, n: its.length };
  }
  return best;
}
function showOpt(q, k) {
  if (k === null || k === undefined) return '<i>sem resposta (tempo esgotado)</i>';
  if (q.kind === 'number') return `<b>${esc(k)}</b>`;
  const o = q.options[k];
  if (o === undefined) return '<i>—</i>';
  if (q.type === 'diagrama') return `<span class="mini">${diagramSvg(o)} nº ${k + 1}</span>`;
  if (q.type === 'matriz') return `<span class="mini">${cellSvg(o)} nº ${k + 1}</span>`;
  if (q.type === 'padrao') return `<b style="font-family:ui-monospace,Consolas,monospace">${esc(o)}</b>`;
  return `<b>${esc(o)}</b>`;
}
function reviewCard(it, idx) {
  const q = it.q;
  let ctx = '';
  if (q.type === 'silogismo') ctx = sylHtml(q.data.items);
  else if (q.type === 'padrao') ctx = `<p style="font-family:ui-monospace,Consolas,monospace;letter-spacing:.1em">${q.options.map(esc).join(' &nbsp; ')}</p>`;
  else if (q.type === 'diagrama') ctx = `<p>Grupos: <b>${esc(q.data.groups.join(', '))}</b></p>`;
  else if (q.type === 'matriz') ctx = matrixHtml(q.data.grid, 220);
  else ctx = `<p>${esc(q.prompt)}</p>`;
  return `<div class="card review">
    <div class="tag">Questão ${idx + 1} · ${TYPE_LABEL[q.type]} · ${LEVEL_LABEL[q.level == null ? 1 : q.level]}${it.timeout ? ' · tempo esgotado' : ` · ${secs(it.ms)}`}</div>
    ${ctx}
    <div class="ans">
      <div><span class="badt">Sua resposta:</span> ${showOpt(q, it.resp)}</div>
      <div><span class="good">Correta:</span> ${showOpt(q, q.answer)}</div>
    </div>
    <div class="expl">${esc(q.explanation)}</div>
  </div>`;
}
function levelSummary(r) {
  return `<div class="card"><b>Nível alcançado por tipo</b><div class="lvrow">` +
    TYPES.filter(t => r.items.some(i => i.q.type === t)).map(t => `<span>${TYPE_LABEL[t]}: ${lvBadge(r.levels[t])}</span>`).join('') +
    '</div><p class="muted" style="margin:8px 0 0;font-size:.9rem">Na prova adaptativa, chegar e se manter no difícil é o que conta.</p></div>';
}

function resultScreen(r, rec, saved) {
  const ok = r.items.filter(i => i.correct).length, n = r.items.length, p = pct(ok, n);
  const timeouts = r.items.filter(i => i.timeout).length;
  const w = r.mode === 'teste' ? weakest(rec.items, 1) : null;
  const wrong = r.items.map((it, i) => ({ it, i })).filter(x => !x.it.correct);
  const drillType = r.mode.split(':')[1] || '';
  show(`
    <h1>${modeName(r.mode, rec.n)} — resultado</h1>
    <div class="card">
      <div class="score" style="color:${barColor(p)}">${ok}/${n}</div>
      <p class="muted" style="margin-top:6px">${p}% de acertos · tempo médio ${secs(r.items.reduce((s, i) => s + i.ms, 0) / n)}${timeouts ? ` · ${timeouts} com tempo esgotado` : ''}</p>
      ${saved ? '' : '<p class="badt" style="font-size:.9rem">Não foi possível salvar o histórico neste navegador.</p>'}
    </div>
    ${levelSummary(r)}
    ${r.mode === 'teste' ? `<h2>Por tipo</h2><div class="card bars">${typeBars(rec.items)}</div>` : ''}
    ${w ? `<div class="card weak"><b>Onde focar: ${TYPE_LABEL[w.t]}</b> (${w.p}%)<p class="muted" style="margin:6px 0 0">${TIPS[w.t]}</p></div>` : ''}
    <div class="row" style="margin:14px 0">
      <button class="btn primary" data-act="${r.mode === 'teste' ? 'test' : 'drill'}" data-type="${drillType}">${r.mode === 'teste' ? 'Novo teste' : 'Treinar de novo'}</button>
      <button class="btn" data-act="home">Início</button>
      <button class="btn" data-act="stats">Meu desempenho</button>
    </div>
    <h2>${wrong.length ? `Revisão dos erros (${wrong.length})` : 'Nenhum erro — mandou bem!'}</h2>
    ${wrong.map(x => reviewCard(x.it, x.i)).join('')}
  `);
}

function statsScreen() {
  stopTimer(); run = null;
  const h = Store.load();
  const all = h.tests.flatMap(t => t.items);
  if (!all.length) {
    show(`<h1>Meu desempenho</h1><div class="card"><p>Você ainda não fez nenhum teste.</p>
      <button class="btn primary" data-act="test">Fazer o primeiro teste</button></div>
      <button class="btn link" data-act="home">Voltar</button>`);
    return;
  }
  const w = weakest(all, 3);
  const accAt = (its, lv) => { const x = its.filter(i => (i.level == null ? 1 : i.level) === lv); return x.length ? `${pct(x.filter(i => i.correct).length, x.length)}%` : '—'; };
  const rows = TYPES.map(t => {
    const its = all.filter(i => i.type === t);
    if (!its.length) return `<tr><td>${TYPE_LABEL[t]}</td><td class="n">—</td><td class="n">—</td><td class="n">—</td><td class="n">—</td><td class="n">0</td></tr>`;
    const ok = its.filter(i => i.correct).length;
    return `<tr><td>${TYPE_LABEL[t]}</td><td class="n" style="color:${barColor(pct(ok, its.length))};font-weight:700">${pct(ok, its.length)}%</td>
      <td class="n">${accAt(its, 0)}</td><td class="n">${accAt(its, 1)}</td><td class="n">${accAt(its, 2)}</td><td class="n">${its.length}</td></tr>`;
  }).join('');
  const recent = h.tests.slice(-12).reverse().map(t => {
    const ok = t.items.filter(i => i.correct).length, d = new Date(t.date);
    return `<tr><td>${modeName(t.mode, t.n)}</td><td>${d.toLocaleDateString('pt-BR')} ${d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' })}</td>
      <td class="n" style="color:${barColor(pct(ok, t.items.length))};font-weight:700">${ok}/${t.items.length}</td></tr>`;
  }).join('');
  show(`
    <h1>Meu desempenho</h1>
    <p class="muted">${all.length} questões respondidas em ${h.tests.length} testes/treinos.</p>
    ${w ? `<div class="card weak"><b>Seu ponto mais fraco: ${TYPE_LABEL[w.t]}</b> (${w.p}% em ${w.n} questões)
      <p class="muted" style="margin:6px 0 10px">${TIPS[w.t]}</p>
      <button class="btn primary" data-act="drill" data-type="${w.t}">Treinar ${TYPE_LABEL[w.t]}</button></div>` : ''}
    <h2>Por tipo (todos os testes)</h2>
    <div class="card bars">${typeBars(all)}</div>
    <div class="card" style="overflow-x:auto"><table>
      <tr><th>Tipo</th><th class="n">Total</th><th class="n">Fácil</th><th class="n">Médio</th><th class="n">Difícil</th><th class="n">Questões</th></tr>${rows}
    </table><p class="muted" style="margin:8px 0 0;font-size:.85rem">Acertos em cada nível de dificuldade.</p></div>
    <h2>Últimos</h2>
    <div class="card" style="overflow-x:auto"><table><tr><th>Teste</th><th>Data</th><th class="n">Nota</th></tr>${recent}</table></div>
    <div class="row"><button class="btn" data-act="home">Voltar</button><button class="btn link" data-act="clear">Apagar histórico</button></div>
  `);
}

/* ================= EVENTOS ================= */
app.addEventListener('click', e => {
  const opt = e.target.closest('[data-ans]');
  if (opt) { if (e.detail > 1) return; answer(Number(opt.dataset.ans), false); return; }
  const b = e.target.closest('[data-act]');
  if (!b) return;
  const act = b.dataset.act;
  if (act === 'test') startRun('teste');
  else if (act === 'drill') startRun('treino:' + b.dataset.type);
  else if (act === 'resume') resumeRun();
  else if (act === 'discard') { if (confirm('Descartar o teste pausado?')) { RunStore.clear(); homeScreen(); } }
  else if (act === 'pause') pauseRun();
  else if (act === 'stats') statsScreen();
  else if (act === 'home') homeScreen();
  else if (act === 'quit') { if (confirm('Desistir do teste? Ele não será salvo. (Para continuar depois, use "Pausar".)')) { RunStore.clear(); stopTimer(); run = null; homeScreen(); } }
  else if (act === 'clear') {
    if (confirm('Apagar todo o histórico de desempenho?')) { try { localStorage.removeItem(Store.key); } catch (err) { /* ignore */ } statsScreen(); }
  }
});
app.addEventListener('submit', e => {
  e.preventDefault();
  if (!run || run.answered) return;
  const inp = document.getElementById('numin');
  const v = parseAnswer(inp ? inp.value : '');
  if (v === null) { const er = document.getElementById('numerr'); if (er) er.textContent = 'Digite um número inteiro (só algarismos).'; return; }
  answer(v, false);
});
// fechar a aba ou o navegador no meio: o teste fica salvo como pausado
window.addEventListener('pagehide', () => { if (run && !run.answered) snapshot(); });

homeScreen();
</script>
</body>
</html>
